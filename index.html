<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Discipline</title>
  <meta name="description" content="Discipline: grupo de estudo gamificado com ranking, XP, níveis e conquistas.">
  <meta name="theme-color" content="#1f6feb">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* aplica tema/fonte antes de pintar (evita "flash") */
    try {
      var p = JSON.parse(localStorage.getItem('discipline.prefs') || '{}');
      var t = p.theme || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      document.documentElement.style.fontSize = [14, 16, 18, 20][p.font == null ? 1 : p.font] + 'px';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"><div class="boot"><img src="assets/logo.svg" alt="" width="64" height="64"></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/card.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
